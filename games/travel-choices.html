<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Travel Choices — Maria Tokareva Teaching</title>
  <meta name="description" content="Choose between two travel options and explain your choice.">
  <style>
    :root{
      --ink:#332c27;--muted:#75695f;--paper:#fffdf9;--sand:#eadbc7;
      --terracotta:#a55736;--terracotta-dark:#7f3e26;--line:rgba(76,59,45,.15);
      --shadow:0 22px 65px rgba(73,52,33,.18);--serif:Georgia,"Times New Roman",serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--ink)}
    body{
      min-height:100vh;overflow-x:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif;
      background:#f6efe4 url("../assets/travel-choices/background.jpg") center/cover fixed no-repeat;
    }
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:rgba(255,253,249,.62)}
    button,a{font:inherit}
    button{color:inherit}
    .topbar{
      width:min(1280px,calc(100% - 40px));height:62px;margin:auto;display:grid;
      grid-template-columns:120px 1fr 120px;align-items:center;position:relative;z-index:10;
    }
    .back{
      display:inline-flex;align-items:center;gap:8px;width:max-content;color:var(--muted);
      text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    }
    .back span{font-size:19px;line-height:1;transition:transform .2s ease}.back:hover span{transform:translateX(-3px)}
    .progress{display:flex;align-items:center;justify-content:center;gap:7px}
    .dot{display:block;width:8px;height:8px;padding:0;border:1px solid rgba(108,84,64,.38);border-radius:50%;background:rgba(255,255,255,.62);cursor:pointer;transition:.25s ease}
    .dot:hover{transform:scale(1.45);border-color:#8d6d50}.dot:focus-visible{outline:2px solid rgba(141,109,80,.45);outline-offset:3px}
    .dot.done{background:#a98a69;border-color:#a98a69}.dot.current{width:12px;height:12px;background:#fff;border:2px solid #8d6d50;box-shadow:0 0 0 4px rgba(255,255,255,.58)}
    .counter{margin-left:8px;color:var(--muted);font-size:13px;font-weight:700;min-width:42px}
    .sound{
      justify-self:end;width:42px;height:42px;border:1px solid rgba(102,78,58,.2);border-radius:50%;
      background:rgba(255,253,249,.76);backdrop-filter:blur(10px);cursor:pointer;font-size:17px;
      display:grid;place-items:center;box-shadow:0 5px 18px rgba(74,50,30,.07);transition:.2s ease;
    }
    .sound:hover{transform:translateY(-2px);background:#fff}
    main{width:min(1280px,calc(100% - 40px));margin:auto;padding:0 0 28px}
    .game{min-height:calc(100vh - 82px);display:flex;flex-direction:column;justify-content:center;transform:translateY(-14px)}
    .heading{text-align:center;margin:0 0 20px}
    h1{font-family:"Segoe Script","Brush Script MT",cursive;font-size:clamp(48px,5.2vw,76px);font-weight:400;line-height:.95;margin:0 0 6px;color:#50463e;letter-spacing:-.03em}
    .subtitle{margin:0;color:#806f61;font-size:clamp(15px,1.45vw,19px)}
    .round-question{font-family:var(--serif);font-size:clamp(28px,3vw,44px);line-height:1.05;text-align:center;color:#443830;margin:0 0 22px}
    .stage{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);align-items:stretch;min-height:450px;transition:.35s ease}
    .choice-card{
      position:relative;min-width:0;height:450px;border:0;padding:0;border-radius:25px;background:var(--paper);
      overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--shadow);outline:none;
      transform-style:preserve-3d;transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .34s ease,opacity .3s ease,filter .3s ease;
      animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;
    }
    .choice-card:nth-child(3){animation-delay:.08s}
    .choice-card:hover:not(.selected){transform:translateY(-7px);box-shadow:0 30px 78px rgba(69,48,29,.24)}
    .choice-card:focus-visible{box-shadow:0 0 0 4px rgba(165,87,54,.3),var(--shadow)}
    .choice-card.unselected{opacity:.72;transform:scale(.975)}
    .photo-wrap{display:block;position:relative;height:calc(100% - 138px);min-height:299px;overflow:hidden;background:#d9cab8}
    .photo{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.7) contrast(1.02) brightness(1.04);transition:transform .75s cubic-bezier(.2,.8,.2,1)}
    .choice-card:hover .photo{transform:scale(1.035)}
    .photo-wrap::after{display:none}
    .choice-letter{position:absolute;top:17px;left:17px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,253,248,.9);backdrop-filter:blur(8px);font:700 12px/1 Inter,sans-serif;letter-spacing:.08em;box-shadow:0 4px 15px rgba(20,15,12,.14)}
    .card-footer{height:138px;padding:18px 24px;display:flex;align-items:center;background:#fffdf9;border-top:1px solid rgba(100,75,55,.1)}
    .label{width:100%;font-family:var(--serif);font-size:clamp(20px,1.75vw,28px);font-weight:600;line-height:1.12;color:#302721;text-align:center}
    .select-label{flex:0 0 auto;color:var(--terracotta-dark);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .select-label::after{content:" →"}
    .or{align-self:center;justify-self:center;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid rgba(116,91,69,.25);border-radius:50%;background:rgba(255,253,249,.78);color:#8e7968;font:700 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 18px rgba(73,52,33,.07)}
    .or::before,.or::after{display:none}
    .choice-panel{position:absolute;z-index:4;left:18px;right:18px;bottom:18px;padding:18px 19px;border-radius:18px;background:rgba(255,253,249,.95);backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(40,28,18,.22);opacity:0;transform:translateY(24px);pointer-events:none;transition:.36s cubic-bezier(.2,.8,.2,1)}
    .choice-card.selected .choice-panel{opacity:1;transform:translateY(0);pointer-events:auto}
    .choice-card.selected .photo{transform:scale(1.025);filter:brightness(.82)}
    .picked{display:flex;align-items:center;gap:9px;color:var(--terracotta-dark);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
    .picked::before{content:"✓";width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--terracotta);color:white;font-size:12px}
    .question{display:grid;grid-template-columns:25px 1fr;gap:9px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:clamp(13px,1.15vw,16px);line-height:1.35}
    .qnum{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#f1e7da;color:#806954;font-size:10px;font-weight:800}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:10px}
    .change{border:0;background:transparent;color:#8c7969;font-weight:700;font-size:12px;cursor:pointer;padding:9px 3px}
    .continue{border:0;border-radius:999px;background:var(--terracotta);color:white;font-weight:800;font-size:13px;padding:11px 18px;cursor:pointer;box-shadow:0 8px 20px rgba(143,67,37,.24);transition:.2s ease}
    .continue:hover{background:var(--terracotta-dark);transform:translateY(-2px)}
    .spark{position:fixed;z-index:50;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:spark .8s ease-out forwards}
    .flash{position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;animation:flash .62s ease-out forwards;background:radial-gradient(circle at var(--x) var(--y),rgba(255,247,214,.7),transparent 35%)}
    .stage.leaving{opacity:0;transform:translateY(10px)}
    .detail-photo{filter:saturate(.7) contrast(1.02) brightness(1.04)}
    .stage.detail{display:block;min-height:500px;perspective:1400px}.detail-card{display:grid;grid-template-columns:58% 42%;min-height:500px;border-radius:28px;overflow:hidden;background:#fffdf9;box-shadow:var(--shadow);animation:detailFlip .62s cubic-bezier(.2,.75,.25,1) both;transform-origin:center}.detail-photo{width:100%;height:100%;min-height:500px;object-fit:cover;filter:none}.detail-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4vw,58px);background:#fffdf9}.detail-kicker{font-size:10px;font-weight:800;letter-spacing:.2em;color:#8d684e;text-transform:uppercase;margin-bottom:18px}.detail-title{font-family:var(--serif);font-size:clamp(34px,3.6vw,55px);font-weight:500;line-height:1.02;margin:0 0 25px;color:#342a24}.detail-question{display:grid;grid-template-columns:28px 1fr;gap:11px;padding:14px 0;border-top:1px solid rgba(111,84,63,.16);font-size:clamp(14px,1.2vw,17px);line-height:1.42;color:#625348}.detail-question .qnum{margin-top:1px}.detail-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:24px}.detail-back{border:0;background:transparent;color:#806e60;font-weight:700;padding:11px 0;cursor:pointer}.detail-next{border:0;border-radius:999px;background:#382f29;color:#fff;font-weight:800;padding:13px 22px;cursor:pointer;box-shadow:0 9px 22px rgba(48,37,30,.2);transition:.2s ease}.detail-next:hover{transform:translateY(-2px);background:#4a3c34}
    .stage.detail{min-height:560px}.stage.detail .detail-card{height:560px;min-height:560px}.stage.detail .detail-photo{height:560px;min-height:560px;filter:saturate(.7) contrast(1.02) brightness(1.04)}.stage.detail .detail-copy{height:560px;min-height:560px}.stage.detail .detail-actions{margin-top:auto;padding-top:24px}
    .final-screen{display:none;width:100%;padding:8px 0 26px}.final-screen.show{display:block;animation:cardIn .55s ease both}
    .final-composition{position:relative;width:100%;min-height:690px;padding:8px 18px 20px}.final-heading-wrap{display:grid;grid-template-columns:minmax(0,1fr) 430px;align-items:center;gap:30px;min-height:215px;margin-bottom:18px}.final-heading-wrap h1{text-align:left;font-size:clamp(46px,5vw,68px);white-space:nowrap;margin:0}
    .final-suitcase{position:relative;width:430px;height:215px;transform:rotate(6deg) translateY(-6px);transition:transform .45s ease}.suitcase-img{position:absolute;inset:50% auto auto 50%;width:470px;max-width:none;max-height:245px;object-fit:contain;transform:translate(-50%,-50%);transition:opacity .45s ease}.suitcase-img.packed{opacity:0}.final-suitcase.packed .empty{opacity:0}.final-suitcase.packed .packed{opacity:1}.final-suitcase.bump{animation:bump .5s ease}
    .choices-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:72px;row-gap:17px;width:min(940px,100%);margin:0 auto}.choice-chip{display:grid;grid-template-columns:28px 1fr;align-items:start;gap:12px;border:0;background:transparent;padding:0;text-align:left;color:#44382f;cursor:pointer;opacity:0;animation:chipIn .45s ease forwards}.choice-check{width:26px;height:26px;border:1px solid rgba(115,88,66,.28);border-radius:50%;display:grid;place-items:center;color:transparent;background:rgba(255,253,249,.72);transition:.2s ease}.choice-chip.checked .choice-check{background:var(--terracotta);border-color:var(--terracotta);color:#fff}.choice-chip.checked .choice-text{text-decoration:line-through;opacity:.55}.choice-text{font-family:var(--serif);font-size:20px;line-height:1.22;transition:.2s ease}
    .speaking-task{width:min(760px,100%);margin:58px auto 0;text-align:center;padding-top:24px;border-top:1px solid rgba(112,84,62,.2)}.task-label{font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--terracotta-dark)}.speaking-task p{font-family:var(--serif);font-size:22px;line-height:1.35;margin:13px 0 0;color:#44382f}.final-actions{text-align:center;margin-top:24px}.primary-btn{border:1px solid rgba(112,84,62,.32);border-radius:999px;padding:12px 22px;background:rgba(255,253,249,.7);color:#57483d;font-weight:800;cursor:pointer;transition:.2s ease}.primary-btn:hover{transform:translateY(-2px);background:#fff}
    .fall-tag{position:fixed;z-index:100;left:50%;top:-70px;display:flex;align-items:center;gap:8px;max-width:270px;padding:7px 10px;border-radius:12px;background:#fffdf9;box-shadow:0 12px 30px rgba(54,38,24,.22);font:600 12px/1.15 Inter,sans-serif;pointer-events:none;animation:fallArc 1.15s cubic-bezier(.2,.72,.3,1) forwards}.fall-tag img{width:34px;height:27px;object-fit:cover;border-radius:6px}
    @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(240deg) scale(.1);opacity:0}}
    @keyframes flash{from{opacity:1}to{opacity:0}}
    @keyframes chipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes bump{50%{transform:rotate(3deg) translateY(-10px) scale(1.04)}}@keyframes fallArc{45%{transform:translate(var(--mx),var(--my)) rotate(calc(var(--r) * .5));opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.45);opacity:0}}
    @keyframes detailFlip{from{opacity:0;transform:rotateY(-8deg) scale(.96)}to{opacity:1;transform:none}}
    @media(max-width:900px){
      body{background-attachment:scroll}.game{justify-content:flex-start;padding-top:12px;transform:none}
      .stage{grid-template-columns:1fr;gap:14px;min-height:auto}.or{width:44px;height:44px}.choice-card{height:428px;min-height:428px}.photo-wrap{height:290px;min-height:0}
      .stage.detail{min-height:0}.stage.detail .detail-card{grid-template-columns:1fr;height:auto;min-height:0}.stage.detail .detail-photo{height:420px;min-height:420px}.stage.detail .detail-copy{height:360px;min-height:360px;padding:28px}.detail-title{font-size:38px}
      .final-heading-wrap{grid-template-columns:minmax(0,1fr) 320px}.final-suitcase{width:320px}.suitcase-img{width:360px}.choices-list{column-gap:28px;row-gap:13px}.choice-text{font-size:17px}
    }
    @media(max-width:560px){
      .topbar,main{width:min(100% - 22px,1280px)}.topbar{grid-template-columns:48px 1fr 48px}.back{font-size:0}.back span{font-size:22px}
      .heading{margin-bottom:14px}h1{font-size:42px}.subtitle{font-size:14px}.choice-card{height:368px;min-height:368px;border-radius:20px}.photo-wrap{height:250px}
      .card-footer{height:118px;padding:15px 17px}.label{font-size:20px}
      .choice-panel{left:10px;right:10px;bottom:10px;padding:14px}.final-composition{padding:8px 0 20px}.final-heading-wrap{grid-template-columns:1fr;text-align:center;gap:4px}.final-heading-wrap h1{text-align:center;white-space:normal}.final-suitcase{width:100%;height:190px}.suitcase-img{width:310px}.choices-list{grid-template-columns:1fr}.choice-text{font-size:16px}.speaking-task{margin-top:38px}.speaking-task p{font-size:18px}
      .stage.detail{min-height:0}.stage.detail .detail-card{height:auto;min-height:0}.stage.detail .detail-photo{height:280px;min-height:280px}.stage.detail .detail-copy{height:340px;min-height:340px;padding:23px 20px}.detail-kicker{margin-bottom:12px}.detail-title{font-size:32px;margin-bottom:18px}.stage.detail .detail-actions{margin-top:auto;padding-top:17px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html"><span aria-hidden="true">←</span> Activities</a>
    <div class="progress" id="progress" aria-label="Game progress"></div>
    <button class="sound" id="sound" type="button" aria-label="Turn sound off" title="Sound on">♪</button>
  </header>

  <main>
    <section class="game" id="game">
      <h1 class="round-question" id="roundQuestion"></h1>
      <div class="stage" id="stage" aria-live="polite"></div>
    </section>

    <section class="final-screen" id="finalScreen">
      <div class="final-composition">
        <div class="final-heading-wrap">
          <div><h1>Your Perfect Holiday</h1></div>
          <div class="final-suitcase" id="suitcasePanel" aria-hidden="true">
            <img class="suitcase-img empty" src="../assets/travel-choices/suitcase-empty.png" alt="">
            <img class="suitcase-img packed" src="../assets/travel-choices/suitcase-packed.png" alt="">
          </div>
        </div>
        <div class="choices-list" id="choicesList"></div>
        <div class="speaking-task"><div class="task-label">YOUR TASK</div><p><em>Describe your perfect holiday. Use all of your choices in one story.</em></p></div>
        <div class="final-actions"><button class="primary-btn" id="playAgain" type="button">Play again →</button></div>
      </div>
    </section>
  </main>

  <script>
    const rounds=[
      {stem:"Would you rather stay for…",a:"3 days in a luxury 5-star hotel",b:"1 month in a simple 1-star hotel",q1:"What would make your holiday unforgettable?",q2:"What comforts could you live without?"},
      {stem:"Would you rather stay in…",a:"a private villa with no Wi-Fi",b:"a city hotel with perfect Wi-Fi",q1:"Could you really disconnect for several days?",q2:"What would you use the internet for while travelling?"},
      {stem:"Would you rather stay in…",a:"a tiny room with an amazing sea view",b:"a huge room with no view at all",q1:"How much time do you usually spend in your hotel room?",q2:"What makes a hotel room comfortable for you?"},
      {stem:"Would you rather travel for…",a:"2 days by train",b:"5 hours by plane",q1:"What would you enjoy during the journey?",q2:"Does the journey matter as much as the destination?"},
      {stem:"Would you rather…",a:"drive yourself on a road trip",b:"join an organised bus tour",q1:"What are the biggest advantages of your choice?",q2:"Have you ever had a memorable road trip or guided tour?"},
      {stem:"Would you rather…",a:"spend every day at the beach",b:"go on a different excursion every day",q1:"Which day of this holiday would you remember years later? Why?",q2:"What would you probably learn or discover during this trip?"},
      {stem:"Would you rather eat at…",a:"an all-you-can-eat hotel buffet every day",b:"local cafés and restaurants every day",q1:"Do you usually eat familiar food or discover a place through its food?",q2:"What problems could happen if you always chose this option?"},
      {stem:"Would you rather…",a:"explore one city really well",b:"visit five cities in one week",q1:"What would your perfect day on this trip look like?",q2:"What could go wrong with this travel plan?"},
      {stem:"Would you rather…",a:"travel with one backpack",b:"pack everything you might need",q1:"What three things would definitely be in your bag?",q2:"Have you ever packed something you never used?"},
      {stem:"Would you rather spend your holiday in…",a:"40°C heat every day",b:"15°C weather every day",q1:"What activities would you do in that weather?",q2:"How does the weather change your holiday?"},
      {stem:"Would you rather lose…",a:"your suitcase",b:"your phone",q1:"Which problem would be easier to solve?",q2:"What problems would this cause during your trip?"},
      {stem:"Would you rather take…",a:"one 1-month holiday",b:"four 1-week holidays during the year",q1:"Which option would make you happier in the long term?",q2:"How do you usually feel after returning from holiday?"}
    ];
    const $=s=>document.querySelector(s),stage=$("#stage"),progress=$("#progress"),soundButton=$("#sound");
    let current=0,choices=[],soundOn=true,audio;
    const image=(round,side)=>`../assets/travel-choices/${round*2+(side==="a"?1:2)}.jpg`;
    const fullQuestion=(r,side)=>`${r.stem.replace("…","").trim()} ${r[side]}?`;

    function audioContext(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();return audio}
    function tone(freq,duration=.09,type="sine",volume=.035,delay=0){if(!soundOn)return;const c=audioContext(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(c.destination);o.start(t);o.stop(t+duration)}
    function selectSound(){tone(440,.13,"sine",.035);tone(659,.18,"sine",.028,.055);tone(880,.22,"sine",.022,.11)}
    function nextSound(){tone(300,.08,"triangle",.02);tone(520,.12,"triangle",.018,.055)}
    function clickSound(){tone(240,.055,"sine",.018)}

    function renderProgress(){
      progress.innerHTML=rounds.map((_,i)=>`<button class="dot ${choices[i]?"done":""} ${i===current?"current":""}" type="button" data-round="${i}" aria-label="Go to pair ${i+1}" ${i===current?'aria-current="step"':''}></button>`).join("")+`<span class="counter">${current+1} / ${rounds.length}</span>`;
      progress.querySelectorAll(".dot").forEach(dot=>dot.addEventListener("click",()=>goToRound(Number(dot.dataset.round))));
    }
    function goToRound(round){if(round===current&&stage.classList.contains("stage")&&!stage.classList.contains("detail"))return;clickSound();current=round;$("#finalScreen").classList.remove("show");$("#game").style.display="flex";render()}
    function cardMarkup(side,r){
      const label=r[side];
      return `<div class="choice-card" data-side="${side}" role="button" tabindex="0" aria-pressed="false" aria-label="${fullQuestion(r,side)}">
        <span class="photo-wrap"><img class="photo" src="${image(current,side)}" alt="${label}" draggable="false"></span>
        <span class="card-footer"><span class="label">${label}</span></span>
      </div>`;
    }
    function render(){
      const r=rounds[current];renderProgress();$("#roundQuestion").textContent=r.stem;stage.className="stage";
      stage.innerHTML=cardMarkup("a",r)+`<div class="or" aria-hidden="true">or</div>`+cardMarkup("b",r);
      stage.querySelectorAll(".choice-card").forEach(card=>{
        card.addEventListener("click",e=>{if(e.target.closest(".change,.continue"))return;choose(card)});
        card.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.target.closest("button")){e.preventDefault();choose(card)}});
        card.addEventListener("pointermove",e=>tilt(card,e));card.addEventListener("pointerleave",()=>card.style.transform="");
      });
      preload();
    }
    function tilt(card,e){if(card.classList.contains("selected")||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`translateY(-7px) perspective(900px) rotateX(${-y*2.2}deg) rotateY(${x*2.2}deg)`}
    function choose(card){
      audioContext().resume();clickSound();const side=card.dataset.side,rect=card.getBoundingClientRect();choices[current]={side,label:rounds[current][side],img:image(current,side)};burst(rect.left+rect.width/2,rect.top+rect.height/2);selectSound();stage.classList.add("leaving");setTimeout(()=>renderDetail(side),260)
    }
    function renderDetail(side){const r=rounds[current],label=r[side];$("#roundQuestion").textContent="";stage.className="stage detail";stage.innerHTML=`<article class="detail-card"><img class="detail-photo" src="${image(current,side)}" alt="${label}"><div class="detail-copy"><div class="detail-kicker">Your answer</div><h2 class="detail-title">${label}</h2><div class="detail-question"><span class="qnum">1</span><span>${r.q1}</span></div><div class="detail-question"><span class="qnum">2</span><span>${r.q2}</span></div><div class="detail-actions"><button class="detail-back" type="button">← Back to options</button><button class="detail-next" type="button">Next pair →</button></div></div></article>`;stage.querySelector(".detail-back").addEventListener("click",change);stage.querySelector(".detail-next").addEventListener("click",next)}
    function change(e){e.stopPropagation();clickSound();choices[current]=undefined;stage.classList.add("leaving");setTimeout(render,220)}
    function next(e){e.stopPropagation();if(!choices[current])return;nextSound();stage.classList.add("leaving");setTimeout(()=>{if(current<rounds.length-1){current++;render();return}const missing=choices.findIndex(choice=>!choice);if(missing>-1){current=missing;render()}else finish()},330)}
    function burst(x,y){for(let i=0;i<18;i++){const p=document.createElement("i");p.className="spark";p.style.left=x+"px";p.style.top=y+"px";p.style.background=i%3===0?"#fff1c9":i%2?"#a55736":"#d9b98e";const a=Math.random()*Math.PI*2,d=45+Math.random()*100;p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),850)}}
    function preload(){if(current<rounds.length-1){["a","b"].forEach(s=>{const img=new Image();img.src=image(current+1,s)})}}
    function finish(){
      $("#game").style.display="none";$("#finalScreen").classList.add("show");progress.innerHTML=`<span class="counter">12 / 12</span>`;renderSummary();animateSuitcase();
    }
    function renderSummary(){
      const list=$("#choicesList");list.innerHTML="";choices.forEach((c,i)=>{const chip=document.createElement("button");chip.type="button";chip.className="choice-chip";chip.style.animationDelay=`${i*45}ms`;chip.setAttribute("aria-pressed","false");chip.innerHTML=`<span class="choice-check">✓</span><span class="choice-text">${c.label}</span>`;chip.addEventListener("click",()=>{const checked=chip.classList.toggle("checked");chip.setAttribute("aria-pressed",String(checked));clickSound()});list.appendChild(chip)})
    }
    function animateSuitcase(){
      const panel=$("#suitcasePanel");panel.classList.remove("packed","bump");document.querySelectorAll(".fall-tag").forEach(t=>t.remove());const target=panel.getBoundingClientRect(),targetX=target.left+target.width*.48,targetY=target.top+target.height*.55;
      choices.forEach((c,i)=>setTimeout(()=>{const tag=document.createElement("div");tag.className="fall-tag";tag.innerHTML=`<img src="${c.img}" alt=""><span>${c.label}</span>`;const startX=innerWidth*.5,dx=targetX-startX+(-35+Math.random()*70),dy=targetY+(-18+Math.random()*32),mx=dx*.55+(-70+Math.random()*140),my=Math.max(80,dy*.42);tag.style.setProperty("--dx",`${dx}px`);tag.style.setProperty("--dy",`${dy}px`);tag.style.setProperty("--mx",`${mx}px`);tag.style.setProperty("--my",`${my}px`);tag.style.setProperty("--r",`${-12+Math.random()*24}deg`);document.body.appendChild(tag);tone(420+i*18,.07,"sine",.012);setTimeout(()=>tag.remove(),1200)},i*95));
      setTimeout(()=>{panel.classList.add("packed","bump");tone(523,.22,"sine",.025);tone(659,.25,"sine",.025,.1);tone(784,.35,"sine",.025,.2);setTimeout(()=>panel.classList.remove("bump"),520)},choices.length*95+420)
    }
    soundButton.addEventListener("click",()=>{soundOn=!soundOn;soundButton.textContent=soundOn?"♪":"×";soundButton.setAttribute("aria-label",soundOn?"Turn sound off":"Turn sound on");soundButton.title=soundOn?"Sound on":"Sound off";if(soundOn)clickSound()});
    $("#playAgain").addEventListener("click",()=>{current=0;choices=[];$("#finalScreen").classList.remove("show");$("#game").style.display="flex";render();clickSound()});
    render();
  </script>
</body>
</html>
